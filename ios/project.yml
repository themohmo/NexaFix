# XcodeGen project definition for NexaFix Scan.
#   brew install xcodegen      (one time)
#   cd ios && xcodegen generate && open NexaFixScan.xcodeproj
# The .xcodeproj is generated and git-ignored; this file is the source of truth.
name: NexaFixScan

options:
  bundleIdPrefix: com.nexafix
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Pick your Team once in Xcode (Signing & Capabilities), or set it here:
    # DEVELOPMENT_TEAM: ABCDE12345
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  NexaFixCore:
    path: NexaFixCore

targets:
  NexaFixScan:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NexaFixScan
    dependencies:
      - package: NexaFixCore
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: NexaFix Scan
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "NexaFix Scan uses the camera and LiDAR sensor to measure and map rooms. Nothing leaves your device unless you export it."
        # Make saved properties and exports visible in the Files app (On My iPhone > NexaFix Scan).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexafix.scan
        PRODUCT_NAME: NexaFixScan
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist

schemes:
  NexaFixScan:
    build:
      targets:
        NexaFixScan: all
    run:
      config: Debug
    archive:
      config: Release
