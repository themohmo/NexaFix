# =============================================================================
#  NEXA FIX — RATE BOOK
#  The single source of truth for every estimate. Fill it in once; every
#  quote reads from here.
#
#  • Prices are AED, excluding VAT.
#  • status = "owner"        -> your confirmed price (never flagged)
#    status = "placeholder"  -> researched UAE market default (2025-26). Quotes
#                               using it are flagged until you confirm it.
#  • Easiest way to update: tell Claude "SPC plank now costs 38" — or run
#      python scripts/rates.py set materials.spc_plank.cost 38
#    Setting a cost/sell marks the item status = "owner" automatically.
#  • cost  = what you pay the supplier per unit.
#    sell  = your resale price per unit (optional). If sell is missing,
#            sell = cost x (1 + markup_pct) using the category markup below.
# =============================================================================

[company]
name = "NEXA FIX"
display_name = "Nexa Fix"
tagline = "Where craft meets quality"
division = "JOINERY & FIT-OUT"
quote_prefix = "NF"
validity_days = 15
warranty_short = "2 Years"
warranty = "Two (2) year warranty against manufacturing defects."
payment_terms = "50% advance payment upon confirmation · 40% upon completion, before delivery · 10% after installation."
phone = ""
email = ""
website = ""
address = "Dubai, United Arab Emirates"
trn = ""          # UAE VAT TRN, printed on the quotation when filled
signatory = ""    # name printed under "For and on behalf of Nexa Fix"

[brand]           # quotation colours
ink = "#1F1D1A"
accent = "#9C7B52"
paper = "#FBF8F3"
line = "#DDD3C4"
muted = "#7A7268"

[pricing]
currency = "AED"
vat_registered = true
vat_pct = 5
default_material_markup_pct = 40   # used when a material has no `sell` and no category markup
ffe_markup_pct = 25                # loose furniture / décor bought in and resold
consumables_pct = 3                # glue, screws, silicone, sandpaper, blades (% of material cost)
contingency_pct = 5                # added to the selling price for surprises (older buildings: 10+)
snagging_reserve_pct = 1.5         # internal reserve for snagging / warranty call-backs (% of sell)
overhead_pct = 12                  # company running costs as % of turnover (rent, office, vehicles, admin)
site_labour_uplift_pct = 10        # towers: lift booking, access, protection, parking (site trades only)
target_margin_pct = 35             # gross margin you aim for (sell - direct cost) / sell
min_margin_pct = 25                # warn below this
round_items_to = 50                # each quoted scope item is rounded UP to this
min_job_value = 1500               # warn when a whole job is smaller than this
show_prelims_line = false          # true: show "Preliminaries & Site Works" as its own quote line

[pricing.category_markup_pct]      # markup on cost when a material has no explicit sell price
flooring = 40
tiles = 35
cladding = 45
gypsum = 35
boards = 50
hardware = 50
finishing = 35
lighting = 60
electrical = 60
glass = 45
paint = 35
upholstery = 50
soft_furnishings = 45
stone = 25
sundries = 40

[defaults]
ceiling_height = 2.8               # m, used when a room/project doesn't say

[schedule]
hours_per_day = 8                  # workshop productive hours
site_hours_per_day = 7             # productive hours on site (towers lose time to lifts/access)
working_days_per_week = 6
workshop_crew = 2                  # carpenters/upholsterers working on this job
site_crew = 4                      # most people on site at once (all trades together)
install_crew = 2                   # joinery installers (install follows fabrication)
trade_crew = 2                     # people per trade unless the trade sets `crew`
procurement_days = 5               # ordering + delivery of boards, hardware, finishes

[preliminaries]                    # project-level costs everyone forgets
markup_pct = 20
trip_cost = 300                    # pickup + driver per delivery / site trip
base_trips = 2                     # material delivery + joinery delivery
site_days_per_trip = 3             # one extra trip every N site days
protection_per_m2 = 6              # floor protection sheets, corner guards, lift protection
protection_min = 250
cleaning_per_m2 = 3
cleaning_min = 300
disposal_base = 300                # packaging / offcut removal
skip_cost = 700                    # added when there is strip-out / demolition
supervision_hours_per_site_day = 2

[min_charges]                      # minimum selling price per item type (AED)
mirror = 350
electrical_point = 250
socket = 250
led_strip = 300
curtains = 400
blinds = 250

[quote]
salutation = "Dear Sir / Madam,"
show_unit_rates = false
letter = [
  "Thank you for extending to {company} the opportunity to submit our quotation for the above mentioned project.",
  "We are pleased to present our proposal for the supply, fabrication, and installation of the works described herein, executed with high quality materials and superior craftsmanship, in strict accordance with the approved drawings, samples, and specifications.",
  "We trust that our offer meets your expectations, and we look forward to your valued confirmation.",
]

[[terms]]
title = "Scope of Work"
text = "Supply, fabrication, delivery, and professional installation of custom made furniture and finishes as per the approved drawings, samples, and materials."

[[terms]]
title = "Pre-Commencement Coordination Meeting"
text = "A mandatory coordination meeting shall be conducted prior to the start of production to finalise and confirm all drawings, dimensions, finishes, materials, and technical specifications. The production timeline shall commence only after written approval following this meeting. Any changes requested thereafter may affect both cost and delivery timeline."

[[terms]]
title = "Payment Terms"
text = "{payment_terms}"

[[terms]]
title = "Validity"
text = "This quotation is valid for {validity_days} days from the date of issue."

[[terms]]
title = "Warranty"
text = "{warranty}"

[[terms]]
title = "Building Approvals"
text = "Building management NOC, access permits and service-lift bookings are to be arranged by the client unless stated otherwise. Refundable deposits required by the building are not included."

# =============================================================================
#  LABOUR — cost_per_hour = your all-in cost (salary, visa, housing, transport,
#  insurance, gratuity) / ~179 productive hours a month.
#  sell_per_hour = what one hour is worth in a quote.
#  where = workshop | site | install (install follows workshop fabrication)
